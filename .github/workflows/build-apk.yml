name: Build Fermata APK

on:
  push:
    # The IPTV check scripts and the notes do not change the APK
    paths-ignore:
      - 'scripts/iptv_*'
      - '.github/workflows/iptv-*.yml'
      - '*.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # Unit tests of the utils library and the app. A separate job, so a failing test is reported
  # without holding back the APKs.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        env:
          NO_GS: true
        run: |
          chmod +x gradlew
          ./gradlew :utils:testDebugUnitTest :xtream:testDebugUnitTest :fermata:testAutoDebugUnitTest -PABI=arm64-v8a --continue

      # Taps through the app at the car's size and a phone's (nav bar, IPTV, ChatGPT, folders,
      # settings, Back) and renders the screens: a broken button fails here, before the APK
      - name: Screens and navigation
        if: always()
        env:
          NO_GS: true
        run: |
          ./gradlew :fermata:testAutoDebugUnitTest -Pscreenshots -PABI=arm64-v8a --tests '*ScreensTest*' --tests '*NavigationTest*' --tests '*MiniPlayerTest*'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            depends/utils/build/reports/tests/
            depends/xtream/build/reports/tests/
            fermata/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build Fermata Auto APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Read versions from version catalog
        run: |
          ver_file=gradle/libs.versions.toml
          version() { grep -Po "(?<=$1).+" $ver_file |  sed -e 's/[= "]//g'; }
          app_version="$(version appVersionName)-$(git rev-parse --short HEAD)"
          sed -ri "s/appVersionName.+/appVersionName = \"$app_version\"/" $ver_file
          echo "APP_VERSION=$app_version" >> $GITHUB_ENV
          echo "ANDROID_NDK_VERSION=$(version ndkVersion)" >> $GITHUB_ENV

      - name: Export vars
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          APP_ID_SFX: ${{ vars.APP_ID_SFX }}
          ARTIFACT_SFX: ${{ vars.ARTIFACT_SFX }}
        run: |
          export_vars() {
            for name in "$@"; do
              local value="${!name}"
              [ -z "$value" ] && continue
              [ "$value" = "none" ] && value=""
              echo "$name=$value" >> "$GITHUB_ENV"
            done
          }
          export_vars APP_NAME APP_ID_SFX ARTIFACT_SFX

      - name: Prepare build identifiers
        env:
          BRANCH_OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          [ -v APP_NAME ] && [ -v APP_ID_SFX ] && [ -v ARTIFACT_SFX ] && exit 0

          sanitize_package_segment() {
            tr '[:upper:]' '[:lower:]' <<< "$1" \
              | sed -E 's/[^a-z0-9]+/_/g; s/^_+|_+$//g; s/_+/_/g; s/^([0-9])/x\1/'
          }

          owner="$(sanitize_package_segment "$BRANCH_OWNER")"
          branch="$(sanitize_package_segment "$BRANCH_NAME")"
          sha="$(git rev-parse --short HEAD)"

          # Short and fixed: Android Auto cuts names at about 10 characters, the commit is in Fermata.log
          [ -v APP_NAME ] || echo "APP_NAME=Fermata H" >> "$GITHUB_ENV"
          [ -v APP_ID_SFX ] || echo "APP_ID_SFX=.${owner}" >> "$GITHUB_ENV"
          [ -v ARTIFACT_SFX ] || echo "ARTIFACT_SFX=-${owner}-${branch}" >> "$GITHUB_ENV"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          key: ${{ runner.os }}-android-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create keystore and local.properties
        run: |
          [ -z "${{ secrets.CI_KEYSTORE }}" ] && exit 0
          echo "${{ secrets.CI_KEYSTORE }}" | base64 -d > keystore.jks

          cat > local.properties <<EOF
          storeFile=$(pwd)/keystore.jks
          keyAlias=${{ secrets.CI_ALIAS }}
          keyPassword=${{ secrets.CI_KEY_PWD }}
          storePassword=${{ secrets.CI_KEYSTORE_PWD }}
          EOF

      # Without a keystore, settings.gradle derives the key from the public default
      # password. A secret seed keeps the signature stable across builds and private.
      - name: Create signing key from seed
        env:
          SIGNING_SEED: ${{ secrets.FERMATA_SIGNING_SEED }}
        run: |
          [ -f local.properties ] && exit 0
          if [ -z "$SIGNING_SEED" ]; then
            echo "::warning::FERMATA_SIGNING_SEED is not set, the APK is signed with the public default key"
            exit 0
          fi
          cat > local.properties <<EOF
          storeFile=$(pwd)/ci-signing.jks
          keyAlias=fermata
          keyPassword=$SIGNING_SEED
          storePassword=$SIGNING_SEED
          EOF

      - name: Build APKs
        env:
          NO_GS: true
        run: |
          out=fermata/build/outputs/apk_from_bundle/autoRelease
          mkdir -p dist/arm64 dist/arm
          echo "App name: $APP_NAME"
          echo "Package suffix: $APP_ID_SFX"
          ARGS=(--build-cache)
           [ -z "$APP_NAME" ] || ARGS+=("-PAPP_NAME=$APP_NAME")
           [ -z "$APP_ID_SFX" ] || ARGS+=("-PAPP_ID_SFX=$APP_ID_SFX")
           ./gradlew fermata:packageAutoReleaseUniversalApk -PABI=arm64-v8a "${ARGS[@]}"
          mv $out/*.apk dist/arm64/
          ./gradlew fermata:packageAutoReleaseUniversalApk -PABI=armeabi-v7a "${ARGS[@]}"
          mv $out/*.apk dist/arm/

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: fermata-auto-${{ env.APP_VERSION }}${{ env.ARTIFACT_SFX }}-arm64
          path: dist/arm64/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload arm APK
        uses: actions/upload-artifact@v4
        with:
          name: fermata-auto-${{ env.APP_VERSION }}${{ env.ARTIFACT_SFX }}-arm
          path: dist/arm/*.apk
          retention-days: 30
          if-no-files-found: error

  # Fermata on a real Android emulator at the car's size (800x400 dp, density 1), driven as a
  # finger and the steering wheel would: IPTV with real video from a fake panel, Back out of the
  # video and the split screen, the same movie again, Menu, a channel's page, YouTube. The
  # screenshots, Fermata.log and the logcat are an artifact; a crash or a failed step fails here.
  # Android Auto itself can't run on an emulator: a debug-only flag turns on the car's screen.
  emulator:
    name: Emulator at the car's size
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK for the emulator (x86_64)
        env:
          NO_GS: true
        run: |
          chmod +x gradlew
          ./gradlew fermata:packageAutoDebugUniversalApk -PABI=x86_64 --build-cache
          ls -la fermata/build/outputs/apk_from_bundle/autoDebug/

      - name: Test videos and the fake IPTV panel
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          mkdir -p build/media build/emulator
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi \
            -i sine=frequency=440 -t 180 -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -shortest -movflags +faststart build/media/movie.mp4
          ffmpeg -loglevel error -f lavfi -i testsrc=size=1280x720:rate=25 -f lavfi \
            -i sine=frequency=660 -t 180 -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -shortest -f mpegts build/media/live.ts
          ls -la build/media
          nohup python3 tools/emulator/fake_panel.py 8080 build/media > build/emulator/panel.log 2>&1 &
          sleep 2
          curl -sf "http://127.0.0.1:8080/player_api.php?username=u&password=p" > /dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/emulator/drive.py "$(ls fermata/build/outputs/apk_from_bundle/autoDebug/*.apk | head -1)" build/emulator

      - name: Upload the emulator run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-car
          path: build/emulator/
          retention-days: 14
          if-no-files-found: ignore
